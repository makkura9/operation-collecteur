<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Carte fictive de Montrive : le lac au sud, la gare à l'est, la vieille ville à l'ouest, les vignes sur la colline au nord">
  <defs>
    <pattern id="vigne" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="7" x2="14" y2="7" stroke="#7aa05a" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#eef1e4"/>
  <!-- Lac -->
  <path d="M0 318 C80 305 150 330 240 318 C330 306 420 330 600 312 L600 400 L0 400 Z" fill="#9cc6e6"/>
  <path d="M40 350 q20 -8 40 0 t40 0 M260 365 q20 -8 40 0 t40 0 M440 345 q20 -8 40 0 t40 0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <!-- Les Quais -->
  <path d="M0 292 C80 280 150 306 240 294 C330 282 420 306 600 290 L600 312 C420 328 330 304 240 316 C150 328 80 303 0 316 Z" fill="#e7d9b8"/>
  <!-- Vieille-Ville -->
  <path d="M40 170 L225 160 L232 280 L50 285 Z" fill="#e9c9a5" stroke="#b58d62" stroke-width="2"/>
  <g stroke="#b58d62" stroke-width="2" opacity="0.8">
    <path d="M60 205 H215 M60 235 H218 M60 262 H222 M110 170 V282 M160 168 V281"/>
  </g>
  <!-- Quartier des Vignes (colline) -->
  <path d="M235 62 L402 70 L398 235 L232 238 Z" fill="#cfe3b5" stroke="#7aa05a" stroke-width="2"/>
  <path d="M235 62 L402 70 L398 235 L232 238 Z" fill="url(#vigne)"/>
  <!-- Quartier de la Gare -->
  <path d="M410 180 L560 176 L565 280 L415 284 Z" fill="#d6d9e2" stroke="#8b92a6" stroke-width="2"/>
  <g stroke="#6b7388" stroke-width="3"><path d="M410 252 H600"/></g>
  <g stroke="#6b7388" stroke-width="2"><path d="M425 246 v12 M445 246 v12 M465 246 v12 M485 246 v12 M505 246 v12 M525 246 v12 M545 246 v12"/></g>
  <rect x="478" y="205" width="52" height="30" rx="3" fill="#8b92a6"/>
  <!-- Gymnase -->
  <rect x="110" y="72" width="70" height="42" rx="4" fill="#c9d3e6" stroke="#5b6f9a" stroke-width="2"/>
  <!-- Étiquettes -->
  <g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" fill="#2b3552" text-anchor="middle">
    <text x="316" y="108" font-size="16" font-weight="700">Quartier des Vignes</text>
    <text x="138" y="222" font-size="15" font-weight="700">Vieille-Ville</text>
    <text x="300" y="305" font-size="14" font-weight="700">Les Quais</text>
    <text x="488" y="200" font-size="14" font-weight="700">Quartier de la Gare</text>
    <text x="145" y="98" font-size="12">Gymnase</text>
    <text x="300" y="372" font-size="16" font-style="italic" fill="#3b6c94">Lac</text>
    <text x="560" y="30" font-size="13" font-weight="700">N ↑</text>
    <text x="20" y="28" font-size="12" fill="#5a647c" text-anchor="start">Carte fictive de Montrive</text>
  </g>
</svg>
